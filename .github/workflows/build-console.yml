name: Build ZwiftPlay Console App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    runs-on: windows-latest  # Use a Windows runner

    strategy:
      matrix:
        configuration: [Debug, Release]  # Builds both configurations

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history if needed

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'  # Adjust to match project requirements

      - name: Build ZwiftPlay Console App
        run: |
          cd Windows/ConsoleApp
          dotnet build ZwiftPlayConsoleApp.csproj --configuration ${{ matrix.configuration }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZwiftPlay-Build-${{ matrix.configuration }}
          path: Windows/ConsoleApp/bin/${{ matrix.configuration }}/
